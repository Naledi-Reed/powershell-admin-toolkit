<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
<style>text{font-family:Arial,sans-serif;fill:#111}.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.arrow{stroke:#444;stroke-width:3;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="24" font-weight="700">PowerShell Administration Toolkit</text>
<rect class="box" x="60" y="90" width="170" height="80" rx="12"/><text x="145" y="125" text-anchor="middle" font-size="17" font-weight="700">Menu</text><text x="145" y="148" text-anchor="middle" font-size="13">do...while + switch</text>
<rect class="box" x="280" y="90" width="170" height="80" rx="12"/><text x="365" y="125" text-anchor="middle" font-size="17" font-weight="700">Admin Functions</text><text x="365" y="148" text-anchor="middle" font-size="13">identity · process · service</text>
<rect class="box" x="500" y="90" width="170" height="80" rx="12"/><text x="585" y="125" text-anchor="middle" font-size="17" font-weight="700">File / System</text><text x="585" y="148" text-anchor="middle" font-size="13">paths · searches · summary</text>
<rect class="box" x="720" y="90" width="170" height="80" rx="12"/><text x="805" y="125" text-anchor="middle" font-size="17" font-weight="700">Evidence</text><text x="805" y="148" text-anchor="middle" font-size="13">tests + readable output</text>
<path class="arrow" d="M230 130 H280"/><path class="arrow" d="M450 130 H500"/><path class="arrow" d="M670 130 H720"/>
<text x="500" y="235" text-anchor="middle" font-size="16">Security relevance: PowerShell is both an administration interface and a common source of Windows security telemetry.</text>
<text x="500" y="280" text-anchor="middle" font-size="16">Future extension: logging → detection → alert triage → response evidence.</text>
</svg>
